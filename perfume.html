<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>TWELVE | น้ำหอม</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<!-- HEADER (โหลดเหมือนหน้าอื่น) -->
<div id="header"></div>

<!-- ===== PERFUME PAGE ===== -->
<section class="section">
  <h2>🌸น้ำหอม</h2>

  <div class="row">
    <button class="row-btn left" onclick="scrollRow('perfume', -1)">‹</button>

    <div class="row-items" id="perfume">

      <!-- PRODUCT CARD -->
      <div class="row-card">
        <img src="assets/images/products/pexels-yusuf-arslan-2018836-3640668.jpg" alt="Perfume">
        <p>TWELVE Perfume</p>
        <span>฿1,290</span>

        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/pexels-yusuf-arslan-2018836-3640668.jpg',
            'ชื่อสินค้า',
            '฿1,290'
          )">ดูสินค้า</button>
        </div>
      </div>

      <!-- คัดลอกการ์ดนี้เพิ่มได้ -->
      <div class="row-card">
        <img src="assets/images/products/pexels-pixabay-264950.jpg">
        <p>Luxury Scent</p>
        <span>฿1,490</span>
        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/pexels-pixabay-264950.jpg',
            'Luxury Scent',
            '฿1,490'
          )">ดูสินค้า</button>
        </div>
      </div>

       <div class="row-card">
        <img src="assets/images/products/pexels-pixabay-264870.jpg">
        <p>Sweet Blossom</p>
        <span>฿1,190</span>
        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/pexels-pixabay-264870.jpg',
            'Sweet Blossom',
            '฿1,190'
          )">ดูสินค้า</button>
        </div>
      </div>

    </div>

    <button class="row-btn right" onclick="scrollRow('perfume', 1)">›</button>
  </div>
</section>

<!-- FOOTER -->
<div id="footer"></div>

<!-- JS -->
<script src="assets/js/main.js"></script>

<script>
/* ===== AUTO SCROLL (เหมือนหน้า products) ===== */
function autoScrollRow(rowId) {
  const row = document.getElementById(rowId);
  let direction = 1;

  setInterval(() => {
    if (
      row.scrollLeft + row.clientWidth >= row.scrollWidth ||
      row.scrollLeft <= 0
    ) {
      direction *= -1;
    }
    row.scrollLeft += direction;
  }, 20);
}

document.addEventListener("DOMContentLoaded", () => {
  autoScrollRow("perfume");
});
</script>

</body>
</html>

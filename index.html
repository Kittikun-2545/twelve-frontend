<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>TWELVE | Home</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="header"></div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-slide active"
         style="background-image:url('assets/images/48acfe6e22687a3111f2cb56e4750df2.jpg')"></div>
    <div class="hero-slide"
         style="background-image:url('assets/images/cover_nevia.jpg')"></div>
    <div class="hero-slide"
         style="background-image:url('assets/images/ff.jpg')"></div>
    <div class="hero-slide"
         style="background-image:url('assets/images/e1624.jpg')"></div>
    <div class="hero-slide"
         style="background-image:url('assets/images/G-o.jpg')"></div>

    <div class="hero-content">
      <h2>TWELVE COLLECTION</h2>
      <p>Cosmetics • Perfumes • Fashion • Creams • Shampoo</p>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="section">
    <h2>สินค้าแนะนำ</h2>
    <div class="grid">
      <div class="product">
        น้ำหอม
        <div class="price">฿1,290</div>
      </div>
      <div class="product">
        ครีมบำรุงผิว
        <div class="price">฿590</div>
      </div>
      <div class="product">
        เสื้อผ้า
        <div class="price">฿890</div>
      </div>
    </div>
  </section>

  <!-- REVIEWS -->
  <section class="section">
    <h2>รีวิวลูกค้า</h2>
    <div class="reviews">
      <div class="review-card">
        <div class="stars">★★★★★</div>
        หอมมาก ใช้แล้วมั่นใจ
      </div>
      <div class="review-card">
        <div class="stars">★★★★☆</div>
        ราคาดี คุ้มค่า
      </div>
      <div class="review-card">
        <div class="stars">★★★★★</div>
        แพ็กเกจสวยมาก
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/js/main.js"></script>
</body>
</html>

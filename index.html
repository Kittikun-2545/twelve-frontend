<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>TWELVE | Home</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="header"></div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-slide active"
         style="background-image:url('assets/images/content-pixie-nyz9sKkvBbA-unsplash.jpg')"></div>
    <div class="hero-slide"
         style="background-image:url('assets/images/point-normal-unsplash.jpg')"></div>
    <div class="hero-slide"
         style="background-image:url('assets/images/nick-noel-Q1y0UdZdNAI-unsplash.jpg')"></div>
    <div class="hero-slide"
         style="background-image:url('assets/images/ryan-hoffman-Cs4GVbMqKGY-unsplash.jpg')"></div>
    <div class="hero-slide"
         style="background-image:url('assets/images/mockup-free-soJjZDPTlIA-unsplash.jpg')"></div>

    <div class="hero-content">
      <h2>TWELVE COLLECTION</h2>
      <p>Cosmetics • Perfumes • Fashion • Creams • Shampoo</p>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="section">
  <h2>สินค้าแนะนำ</h2>
  <div class="grid">
  <div class="product-img">
  <div class="product">
  <img src="assets/images/products/pexels-pixabay-264870.jpg" alt="">
  <h3>น้ำหอม</h3>
  <p class="desc">กลิ่นหรู หอมติดทนนาน</p>
  <div class="price">฿1,190</div>
  </div>
  </div>

  <div class="product-img">
  <div class="product">
  <img src="assets/images/products/pexels-karola-g-4465124.jpg" alt="">
  <h3>ครีมบำรุงผิว</h3>
  <p class="desc">ใชง่ายผิวไม่แห้ง</p>
  <div class="price">฿450</div>
  </div>
  </div>
  
  <div class="product-img">
  <div class="product">
  <img src="assets/images/products/pexels-pixabay-264950.jpg" alt="">
  <h3>น้ำหอม</h3>
  <p class="desc">ใช้แล้วหอมนาน</p>
  <div class="price">฿1,490</div>
  </div>
  </div>

  </section>

  <!-- REVIEWS -->
  <section class="section">
    <h2>รีวิวลูกค้า</h2>
    <div class="reviews">
      <div class="review-card">
        <div class="stars">★★★★★</div>
        หอมมาก ใช้แล้วมั่นใจ
      </div>
      <div class="review-card">
        <div class="stars">★★★★☆</div>
        ราคาดี คุ้มค่า
      </div>
      <div class="review-card">
        <div class="stars">★★★★★</div>
        แพ็กเกจสวยมาก
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/js/main.js"></script>
</body>
</html>

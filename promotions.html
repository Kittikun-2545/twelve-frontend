<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Promotion</title>

  <!-- main css -->
  <link rel="stylesheet" href="assets/css/main.css">
  <!-- promotion css -->
  <link rel="stylesheet" href="assets/css/promotion.css">
</head>
<body>

  <div id="header"></div>

<section class="promotion-section">
  <h2>🔥 โปรโมชั่นพิเศษ</h2>

  <div class="promotion-grid">

    <div class="promo-card">
      <span class="discount-badge">-20%</span>

      <img src="assets/images/products/pexels-yusuf-arslan-2018836-3640668.jpg" alt="">

      <p class="promo-name">TWELVE Perfume</p>

      <div class="promo-price">
        <span class="old-price">฿1,590</span>
        <span class="new-price">฿1,290</span>
      </div>

      <button class="promo-btn">ซื้อเลย</button>
    </div>

    <div class="promo-card">
      <span class="discount-badge">-15%</span>

      <img src="assets/images/products/pexels-pixabay-264870.jpg" alt="">

      <p class="promo-name">Sweet Blossom</p>

      <div class="promo-price">
        <span class="old-price">฿1,390</span>
        <span class="new-price">฿1,190</span>
      </div>

      <button class="promo-btn">ซื้อเลย</button>
    </div>

    <div class="promo-card">
      <span class="discount-badge">-30%</span>

      <img src="assets/images/products/pexels-pixabay-264950.jpg" alt="">

      <p class="promo-name">Luxury Scent</p>

      <div class="promo-price">
        <span class="old-price">฿2,129</span>
        <span class="new-price">฿1,490</span>
      </div>

      <button class="promo-btn">ซื้อเลย</button>
    </div>

  </div>
</section>
<div id="footer"></div>

<script src="assets/js/main.js"></script>

</body>
</html>

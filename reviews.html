<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>TWELVE | Reviews</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/review.css">

</head>
<body>

<div id="header"></div>

<section class="section">
  <h2>⭐ รีวิวจากลูกค้า</h2>

<section class="reviews">

  <div class="reviews-scroll">
  <div class="review-card">
    <img src="assets/images/profile/S__นุ๊ก.jpg"
         class="review-avatar"
         onclick="openImage(this.src)"
         alt="profile">
    <div class="review-content">
      <h4>Anna</h4>
      <p>กลิ่นหอมมาก ใช้แล้วมั่นใจขึ้น 🥰</p>
      <span class="review-role">ลูกค้าประจำ</span>
      <div class="review-stars">★★★★★</div>
    </div>
  </div>

  <div class="review-card">
    <img src="assets/images/profile/พลอย.jpg"
         class="review-avatar"
         onclick="openImage(this.src)"
         alt="profile">
    <div class="review-content">
      <h4>James</h4>
      <p>แพ็กเกจดูดี ส่งไว 👍</p>
      <span class="review-role">ลูกค้าประจำ</span>
      <div class="review-stars">★★★★☆</div>
    </div>
  </div>

  <div class="review-card">
    <img src="assets/images/profile/เพลง.jpg"
         class="review-avatar"
         onclick="openImage(this.src)"
         alt="profile">
    <div class="review-content">
      <h4>May</h4>
      <p>ราคาดี กลิ่นติดทน 💕</p>
      <span class="review-role">ลูกค้าประจำ</span>
      <div class="review-stars">★★★★★</div>
    </div>
  </div>

<div class="review-card">
    <img src="assets/images/profile/เบลล่า.jpg"
         class="review-avatar"
         onclick="openImage(this.src)"
         alt="profile">
    <div class="review-content">
      <h4>เบลล่า พอร์ช</h4>
      <p> เสื้อผ้าคุณภาพดี ใส่สบาย</p>
      <span class="review-role">ลูกค้าประจำ</span>
      <div class="review-stars">★★★★★</div>
    </div>
  </div>

  <div class="review-card">
    <img src="assets/images/profile/เค.jpg"
         class="review-avatar"
         onclick="openImage(this.src)"
         alt="profile">
    <div class="review-content">
      <h4>เคร่า งับ</h4>
      <p>ส่งไว แอดมินตอบเร็วมากค่าา<_> </p>
      <span class="review-role">ลูกค้าใหม่</span>
      <div class="review-stars">★★★★☆</div>
    </div>
  </div>
  </div>

</section>

<!-- IMAGE MODAL -->
<div id="imgModal" class="img-modal" onclick="closeImage()">
  <span class="close">&times;</span>
  <img id="modalImg">
</div>
</section>

<div id="footer"></div>
<script src="assets/js/main.js"></script>
<script src="assets/js/review.js"></script>
</body>
</html>

<script>
function autoScrollRow(rowId) {
  const row = document.getElementById(rowId);
  let direction = 1;

  setInterval(() => {
    // ชนขอบขวา หรือ ขอบซ้าย → กลับทิศ
    if (
      row.scrollLeft + row.clientWidth >= row.scrollWidth ||
      row.scrollLeft <= 0
    ) {
      direction *= -1;
    }

    row.scrollLeft += direction;
  }, 20);
}

document.addEventListener("DOMContentLoaded", () => {
  autoScrollRow("perfume"); // ← id ของ row-items
});
</script>

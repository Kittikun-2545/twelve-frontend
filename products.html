<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>TWELVE | Products</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<!-- ===== PRODUCT MODAL ===== -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">×</span>
    <img id="modalImg">
    <h3 id="modalTitle"></h3>
    <p id="modalPrice"></p>
    <button class="buy-btn">เพิ่มลงตะกร้า</button>
  </div>
</div>

<div id="header"></div>

  <div class="row">
    <button class="row-btn left" onclick="scrollRow('perfume', -1)">‹</button>

    <div class="row-items" id="perfume">

      <div class="row-card">
        <img src="assets/images/products/perfume1.jpg">
        <p>TWELVE Perfume</p>
        <span>฿1,290</span>
        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/perfume1.jpg',
            'TWELVE Perfume',
            '฿1,290'
          )">ดูสินค้า</button>
        </div>
      </div>

      <div class="row-card">

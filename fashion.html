<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>TWELVE | เสื้อผ้า</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div id="header"></div>

<section class="section">
  <h2>👕เเฟชั่น</h2>

  <div class="row">
    <button class="row-btn left" onclick="scrollRow('fashion', -1)">‹</button>

    <div class="row-items" id="fashion">

      <!-- PRODUCT CARD -->
      <div class="row-card">
        <img src="assets/images/products/pexels-vika-glitter-392079-6130831.jpg" alt="fashion">
        <p>Event Dress</p>
        <span>฿1,590</span>

        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/pexels-vika-glitter-392079-6130831.jpg',
            'ชื่อสินค้า',
            '฿1,590'
          )">ดูสินค้า</button>
        </div>
      </div>

     <div class="row-card">
        <img src="assets/images/products/pexels-eliasdecarvalho-1007011.jpg" alt="fashion">
        <p>Evening Dress</p>
        <span>฿1,399</span>

        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/pexels-eliasdecarvalho-1007011.jpg',
            'ชื่อสินค้า',
            '฿1,399'
          )">ดูสินค้า</button>
        </div>
      </div>

      <div class="row-card">
        <img src="assets/images/products/pexels-pixabay-54265.jpg" alt="fashion">
        <p>Pink Bikini</p>
        <span>฿590</span>

        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/pexels-pixabay-54265.jpg',
            'ชื่อสินค้า',
            '฿590'
          )">ดูสินค้า</button>
        </div>
      </div>

    </div>
  </div>
</section>

<div id="footer"></div>
<script src="assets/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>TWELVE | เครื่องสำอาง</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div id="header"></div>

<section class="section">
  <h2>💄เครื่องสำอาง</h2>

  <div class="row">
    <button class="row-btn left" onclick="scrollRow('cosmetics', -1)">‹</button>

    <div class="row-items" id="perfume">

      <!-- PRODUCT CARD -->
      <div class="row-card">
        <img src="assets/images/products/pexels-ian-panelo-3552894.jpg" alt="Cosmetics">
        <p>BB</p>
        <span>฿290</span>

        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/pexels-ian-panelo-3552894.jpg',
            'ชื่อสินค้า',
            '฿290'
          )">ดูสินค้า</button>
        </div>
      </div>

      <div class="row-card">
        <img src="assets/images/products/pexels-suzyhazelwood-2533266.jpg" alt="Cosmetics">
        <p>ลิปสติก</p>
        <span>฿159</span>

        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/pexels-suzyhazelwood-2533266.jpg',
            'ชื่อสินค้า',
            '฿159'
          )">ดูสินค้า</button>
        </div>
      </div>

      <div class="row-card">
        <img src="assets/images/products/pexels-karola-g-5632356.jpg" alt="Cosmetics">
        <p>ครีมบำรุง</p>
        <span>฿169</span>

        <div class="product-action">
          <button onclick="openModal(
            'assets/images/products/pexels-karola-g-5632356.jpg',
            'ชื่อสินค้า',
            '฿169'
          )">ดูสินค้า</button>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="assets/js/main.js"></script>
</body>
</html>
